services:
  postgres:
    image: postgres:13-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=main_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch_db
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.disabled=true # Disabled for dev
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  postfix:
    image: boky/postfix:latest
    container_name: postfix_smtp
    environment:
      - ALLOWED_SENDER_DOMAINS=safematrix.local
      - HOSTNAME=mail.safematrix.local
      - POSTFIX_inet_protocols=ipv4
      - RELAYHOST=[smtp.gmail.com]:587
      - RELAYHOST_USERNAME=cyberurldetector@gmail.com
      - RELAYHOST_PASSWORD=VOTRE_MOT_DE_PASSE_APP_ICI
    ports:
      - "1025:587"
    volumes:
      - ./postfix/logs:/var/log
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_queue
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.worker
    depends_on:
      - redis
      - postgres
      - opensearch
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/main_db
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - SECRET_KEY=your-secret-key-here-change-in-production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app/backend
      - .:/app
    restart: unless-stopped
    working_dir: /app
    command: celery -A backend.core.task_queue.celery_app worker --loglevel=info --queues=workflows,batch_processing

  celery-flower:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.worker
    depends_on:
      - redis
      - celery-worker
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/main_db
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - SECRET_KEY=your-secret-key-here-change-in-production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app/backend
      - .:/app
    restart: unless-stopped
    working_dir: /app
    command: celery -A backend.core.task_queue.celery_app flower --port=5555

  workflow-scheduler:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.worker
    depends_on:
      - redis
      - postgres
      - opensearch
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/main_db
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - SECRET_KEY=your-secret-key-here-change-in-production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app/backend
      - .:/app
    restart: unless-stopped
    working_dir: /app
    command: python backend/workflow_scheduler.py

volumes:
  postgres_data:
  opensearch_data:
  redis_data:
