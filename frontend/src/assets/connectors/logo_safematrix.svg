
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" fill="none">
  <!-- Radar -->
  <g transform="translate(70,90)">
    <circle cx="0" cy="0" r="60" stroke="#0a2e52" stroke-width="6" fill="none"/>
    <circle cx="0" cy="0" r="40" stroke="#0a2e52" stroke-width="6" fill="none"/>
    <circle cx="0" cy="0" r="20" stroke="#0a2e52" stroke-width="6" fill="none"/>
    
    <!-- Axes -->
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#0a2e52" stroke-width="6"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#0a2e52" stroke-width="6"/>
    
    <!-- Points sur le radar -->
    <circle cx="-20" cy="-10" r="5" fill="#0a2e52"/>
    <circle cx="25" cy="15" r="5" fill="#0a2e52"/>
    <circle cx="10" cy="35" r="5" fill="#0a2e52"/>
    
    <!-- Aiguille -->
    <line x1="0" y1="0" x2="42" y2="-30" stroke="#1ee0ff" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <!-- Texte -->
  <text x="150" y="85" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#0a2e52">Safe</text>
  <text x="150" y="135" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1ee0ff">Matrix</text>
</svg>
